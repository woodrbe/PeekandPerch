name: Automated Birdfy Feeder Sync

on:
  schedule:
    # Runs daily at 13:00 UTC (8:00 AM CST)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      highlight_uuid:
        description: 'Birdfy Highlight Share Link or UUID (optional, overrides secret)'
        required: false
        type: string
      recap_uuid:
        description: 'Birdfy Monthly Recap Link or UUID (optional, overrides secret)'
        required: false
        type: string
      date_range:
        description: 'Date range to sync (last_7_days, last_30_days, today, all_time)'
        required: false
        default: 'last_7_days'
        type: choice
        options:
          - last_7_days
          - last_30_days
          - today
          - all_time

permissions:
  contents: write

jobs:
  sync:
    name: Sync Birdfy Moments to JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Feeder Sync Script
        env:
          TZ: "America/Chicago"
          BIRDFY_HIGHLIGHT_UUID: ${{ inputs.highlight_uuid || secrets.BIRDFY_HIGHLIGHT_UUID || secrets.BIRDFY_UUID }}
          BIRDFY_RECAP_UUID: ${{ inputs.recap_uuid || secrets.BIRDFY_RECAP_UUID }}
          BIRDFY_DATE_RANGE: ${{ inputs.date_range || 'last_7_days' }}
        run: npx tsx scripts/sync-birdfy.ts

      - name: Commit & Push Updated Feeder Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain public/data/sightings.json) ]]; then
            echo "✨ New bird detections found! Committing to main..."
            git add public/data/sightings.json
            git commit -m "chore(data): automated Birdfy feeder sync [skip ci]"
            git push origin main
          else
            echo "✓ No new feeder detections to commit (data is already up to date)."
          fi

