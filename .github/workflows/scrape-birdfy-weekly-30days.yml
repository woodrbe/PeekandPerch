name: Birdfy Weekly 30-Day Deep Scraper

on:
  schedule:
    # Runs weekly on Sunday at 12:00 AM Central Time (05:00 UTC Sunday)
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to scrape (default: 30)'
        required: false
        type: string
        default: '30'
      device_id:
        description: 'Target Feeder Device ID (optional, overrides secret)'
        required: false
        type: string
      max_events:
        description: 'Maximum number of event detections to scrape (default: unlimited)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape-30days:
    name: Scrape Last 30 Days from my.birdfy.com
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Autonomous 30-Day Scraper Agent
        env:
          TZ: "America/Chicago"
          BIRDFY_EMAIL: ${{ secrets.BIRDFY_EMAIL }}
          BIRDFY_PASSWORD: ${{ secrets.BIRDFY_PASSWORD }}
          BIRDFY_DEVICE_ID: ${{ inputs.device_id || secrets.BIRDFY_DEVICE_ID }}
          FEEDER_LAT: ${{ secrets.FEEDER_LAT || vars.FEEDER_LAT }}
          FEEDER_LON: ${{ secrets.FEEDER_LON || vars.FEEDER_LON }}
          FEEDER_CITY: ${{ secrets.FEEDER_CITY || vars.FEEDER_CITY }}
          FEEDER_ZIP: ${{ secrets.FEEDER_ZIP || vars.FEEDER_ZIP }}
          HEADLESS: "true"
        run: |
          CLI_ARGS="--days 30"
          if [ -n "${{ inputs.days }}" ]; then
            CLI_ARGS="--days \"${{ inputs.days }}\""
          fi
          if [ -n "${{ inputs.max_events }}" ]; then
            CLI_ARGS="$CLI_ARGS --max \"${{ inputs.max_events }}\""
          fi
          eval "npx tsx scripts/scrape-birdfy-agent.ts $CLI_ARGS"

      - name: Commit & Push Updated Feeder Detections
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain public/data/sightings.json) ]]; then
            echo "✨ New bird detections found by Weekly 30-Day Scraper! Committing to main..."
            git add public/data/sightings.json
            git commit -m "chore(data): weekly 30-day Birdfy historical sync [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "✓ Dataset is already up to date with latest feeder captures."
          fi

